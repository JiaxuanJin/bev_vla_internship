<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="790" viewBox="0 0 1380 790">
<title>Unified Stage2 forward and real single-frame backward architecture</title>
<desc>Text and visual BEV produce two-dimensional semantic features before attention. The same fused BEV feeds detection and segmentation. Real GT is used only by training losses. Bypass returns the original features.</desc>
<rect width="1380" height="790" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<text x="20" y="30" font-size="23" font-weight="bold">Stage 2 | Unified inference and single-frame gradient verification</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<rect x="20" y="70" width="205" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="32" y="99" font-size="17" font-weight="bold">Language input</text>
<text x="32" y="125" font-size="13">preprocess / tokenizer</text>
<rect x="260" y="70" width="205" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="272" y="99" font-size="17" font-weight="bold">Frozen DistilBERT</text>
<text x="272" y="125" font-size="13">t: [B,768]</text>
<rect x="500" y="70" width="205" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="512" y="99" font-size="17" font-weight="bold">SemanticProjection</text>
<text x="512" y="125" font-size="13">q: [B,256]</text>
<rect x="20" y="270" width="205" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="32" y="299" font-size="17" font-weight="bold">Six camera images</text>
<text x="32" y="325" font-size="13">real nuScenes frame</text>
<rect x="260" y="270" width="205" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="272" y="299" font-size="17" font-weight="bold">BEVFormer BEV</text>
<text x="272" y="325" font-size="13">F: [B,256,150,150]</text>
<rect x="500" y="270" width="205" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="512" y="299" font-size="17" font-weight="bold">Visual projection</text>
<text x="512" y="325" font-size="13">V: normalized 2D grid</text>
<rect x="755" y="165" width="250" height="92" rx="12" fill="#fff7ed" stroke="#94a3b8"/>
<text x="767" y="194" font-size="17" font-weight="bold">2D semantic features</text>
<text x="767" y="220" font-size="13">S = normalize(q) * V</text>
<rect x="1050" y="165" width="270" height="92" rx="12" fill="#fff7ed" stroke="#94a3b8"/>
<text x="1062" y="194" font-size="17" font-weight="bold">Spatial Attention</text>
<text x="1062" y="220" font-size="13">A = sigmoid(sum(S) / T)</text>
<rect x="1050" y="330" width="270" height="92" rx="12" fill="#fff7ed" stroke="#94a3b8"/>
<text x="1062" y="359" font-size="17" font-weight="bold">Residual Fusion / Bypass</text>
<text x="1062" y="385" font-size="13">F + alpha * F * A</text>
<rect x="455" y="505" width="240" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="467" y="534" font-size="17" font-weight="bold">3D Detection Head</text>
<text x="467" y="560" font-size="13">real cls + bbox loss</text>
<rect x="735" y="505" width="240" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="747" y="534" font-size="17" font-weight="bold">Map Segmentation</text>
<text x="747" y="560" font-size="13">real map GT + CE</text>
<rect x="1015" y="505" width="310" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="1027" y="534" font-size="17" font-weight="bold">Attention supervision</text>
<text x="1027" y="560" font-size="13">author cropper + map class GT</text>
<rect x="20" y="505" width="245" height="76" rx="12" fill="#eff6ff" stroke="#94a3b8"/>
<text x="32" y="534" font-size="17" font-weight="bold">GT: supervision only</text>
<text x="32" y="560" font-size="13">no GT in inference features</text>
<rect x="625" y="665" width="420" height="70" rx="12" fill="#fff7ed" stroke="#94a3b8"/>
<text x="637" y="694" font-size="17" font-weight="bold">Combined loss / backward</text>
<text x="637" y="720" font-size="13">Ldet + Lseg + 0.1 Latt; NO optimizer.step</text>
<path d="M225 108 H260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M465 108 H500" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
