<path d="M465 308 H500" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M705 308 H725 V230 H755" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1005 211 H1050" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1185 257 V330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M363 346 V375 H1050" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1185 422 V465 H575 V505" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1185 465 H855 V505" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1320 211 H1350 V543 H1325" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M575 581 V620 H740 V665" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M855 581 V665" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M1170 581 V620 H960 V665" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M265 543 H300 V600 H855 V581" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M265 543 H455" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M142 581 V640 H1170 V581" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="20" y="772" font-size="13" fill="#475569">Tensor/gradient functionality only. Semantic localization and accuracy gains are separate, unverified research questions.</text>
</svg>
